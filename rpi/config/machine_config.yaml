# PickupWinder — Machine configuration for RPi + ESP32 platform
#
# MIGRATION: Values preserved from BBB config.example.json and
# HardwareDefinition class in pickup/core/__init__.py.
# All step counts and speeds verified against original.

# ── SPI transport ────────────────────────────────────────────────────────────

spi:
  bus: 0          # /dev/spidev0.0
  device: 0
  speed_hz: 4000000   # 4 MHz SPI clock
  mode: 0             # CPOL=0, CPHA=0

# ── Axis hardware definitions ────────────────────────────────────────────────

axes:
  bobbin:
    id: 0
    steps_per_rev: 6400       # 200 full-steps × 32 microstepping
    microstepping: 32
    min_hz: 1067              # ~10 RPM
    max_hz: 160000            # ~1500 RPM
    max_rpm: 1500
    default_accel: 100000     # steps/s²

  lateral:
    id: 1
    steps_per_rev: 3072       # 96 full-steps × 32 microstepping
    microstepping: 32
    steps_per_mm: 3072        # M6 leadscrew, 1 mm pitch
    min_hz: 100
    max_hz: 160000
    traverse_max_mm: 20.0     # maximum carriage travel
    home_hz: 2000             # homing approach speed
    traverse_hz: 15000        # fast positioning speed
    rodage_hz: 5000           # break-in speed
    default_accel: 100000     # steps/s²
    home_backoff_mm: 2.0

  tensioner:
    id: 2
    steps_per_rev: 3200       # 200 full-steps × 16 microstepping
    microstepping: 16
    min_hz: 0
    max_hz: 10000
    default_accel: 50000

# ── Tension control ──────────────────────────────────────────────────────────

tension:
  target_grams: 50
  max_grams: 200
  kp: 10.0
  ki: 0.5
  max_hz: 5000
  update_interval_s: 0.05

# ── Application parameters ───────────────────────────────────────────────────

app:
  tick_hz: 100             # main loop frequency (Hz)
  approach_turns: 50       # slow start turns before full speed
  approach_hz_floor: 3200  # minimum Hz during approach ramp
  rodage_dist_mm: 10.0     # break-in distance
  rodage_passes: 10        # break-in passes count

# ── Bobbin presets ───────────────────────────────────────────────────────────
#
# MIGRATION: From BBB data/presets.json.
# total_mm = bobbin outer width
# flange_left_mm / flange_right_mm = non-winding zones
# wire_mm = default wire gauge for the preset

bobbin_presets:
  strat:
    name: "Stratocaster"
    total_mm: 17.0
    flange_left_mm: 1.5
    flange_right_mm: 1.5
    wire_mm: 0.071      # AWG 42
    default_turns: 8000

  telecaster:
    name: "Telecaster Bridge"
    total_mm: 18.5
    flange_left_mm: 1.5
    flange_right_mm: 1.5
    wire_mm: 0.071
    default_turns: 8500

  p90:
    name: "P-90"
    total_mm: 30.0
    flange_left_mm: 2.0
    flange_right_mm: 2.0
    wire_mm: 0.071
    default_turns: 10000

  humbucker:
    name: "Humbucker"
    total_mm: 38.0
    flange_left_mm: 2.5
    flange_right_mm: 2.5
    wire_mm: 0.063      # AWG 43
    default_turns: 5000

  jazzmaster:
    name: "Jazzmaster"
    total_mm: 25.0
    flange_left_mm: 2.0
    flange_right_mm: 2.0
    wire_mm: 0.071
    default_turns: 9000
