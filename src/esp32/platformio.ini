; PlatformIO Configuration — PickupWinder ESP32 Stepper Controller
;
; Real-time 3-axis stepper engine (Core 1) + SPI slave comm (Core 0)
; + sensor acquisition task (Core 0).
; Framework: ESP-IDF (no Arduino).
;
; Build: pio run        Flash: pio run -t upload
; Monitor: pio device monitor -b 115200
;
; UART console is DISABLED (sdkconfig.defaults: CONFIG_ESP_CONSOLE_UART_NONE).
; GPIO 1/3 are used for the manual encoder.
; Use pio run -t monitor at your own risk (no output expected on UART0).

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -std=gnu++17
    -Wall -Wextra

; ── Upload / Debug ───────────────────────────────────────────────────────────
upload_speed = 921600
; upload_port = /dev/ttyUSB0    ; uncomment and adapt if needed

; ── Library dependencies ─────────────────────────────────────────────────────
lib_deps =
    FastAccelStepper

; ── Partition table ──────────────────────────────────────────────────────────
; Default partition is fine (1.2 MB app + 1.5 MB SPIFFS).
; board_build.partitions = default.csv
